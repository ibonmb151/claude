name: Mym
options:
  bundleIdPrefix: com.tuempresa
  createIntermediateGroups: true
  xcodeVersion: "1420"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # tu Team ID, o elígelo en Xcode > Signing & Capabilities

# Dos apps en el mismo proyecto: Mym (Mac) y MymPhone (iPhone).
# Cada una lleva su extensión de widgets.
targets:

  Mym:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: Mym
        excludes: ["iOS/**"]
      - path: Shared
    dependencies:
      - target: MymWidgets
        embed: true
    settings:
      base:
        PRODUCT_NAME: Mym
        PRODUCT_BUNDLE_IDENTIFIER: com.tuempresa.mym
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mym
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Config/Mym-macOS.entitlements
        ENABLE_PREVIEWS: YES

  MymWidgets:
    type: app-extension
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: MymWidgets
      - path: Shared
    info:
      path: Config/WidgetsMac-Info.plist
      properties:
        CFBundleDisplayName: Mym Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: MymWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.tuempresa.mym.widgets
        CODE_SIGN_ENTITLEMENTS: Config/MymWidgets-macOS.entitlements
        SKIP_INSTALL: YES

  MymPhone:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Mym
        excludes: ["Mac/**"]
      - path: Shared
    dependencies:
      - target: MymPhoneWidgets
        embed: true
    settings:
      base:
        PRODUCT_NAME: Mym
        PRODUCT_BUNDLE_IDENTIFIER: com.tuempresa.mym
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mym
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Confirmar con Face ID la parada de las células."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES

  MymPhoneWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MymWidgets
      - path: Shared
    info:
      path: Config/WidgetsPhone-Info.plist
      properties:
        CFBundleDisplayName: Mym Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: MymWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.tuempresa.mym.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
