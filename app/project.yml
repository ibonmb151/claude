name: Mym
options:
  bundleIdPrefix: com.tuempresa
  createIntermediateGroups: true
  xcodeVersion: "1420"
  deploymentTarget:
    iOS: "16.0"
    macOS: "12.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # pon aquí tu Team ID, o elígelo en Xcode > Signing & Capabilities

targets:
  Mym:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Mym
      - path: Shared
    dependencies:
      - target: MymWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuempresa.mym
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mym
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Confirmar con Face ID la parada de las células."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Mym/Mym-macOS.entitlements

  MymWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: MymWidgets
      - path: Shared
    info:
      path: MymWidgets/Info.plist
      properties:
        CFBundleDisplayName: Mym Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuempresa.mym.widgets
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": MymWidgets/MymWidgets-macOS.entitlements
